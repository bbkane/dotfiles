# espanso match file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the base matches (aka snippets)
# that will be available in every application when using espanso.

# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.
matches:
  # Using these for notes (and actually I'm not using them these days...)
  - trigger: ";asked"
    replace: ":question: ASKED-"

  - trigger: ";blocked"
    replace: ":stop_sign: BLOCKED-"

  - trigger: ";done"
    replace: "DONE-"

  - trigger: ";todo"
    replace: ":memo: TODO-"

    # Trying this for AI in code / markdown
  - trigger: ";td"
    replace: "TODO:"

  - trigger: "#td"
    replace: "# TODO:"

  - trigger: "/td"
    replace: "// TODO:"

  # Times and dates: https://docs.rs/chrono/latest/chrono/format/strftime/index.html
  - trigger: ";date"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ";day"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%a %Y-%m-%d"

  - trigger: ";time"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%H:%M"

