# https://sw.kovidgoyal.net/kitty/conf/
# Installed with: brew install --cask kitty
# Reload a running kitty with ctrl+cmd+, (macOS)
#
# I mostly use WezTerm; kitty is here for inline images in Neovim (see
# nvim/README.md), which need its graphics protocol.

# --- font ---------------------------------------------------------------
# Matches wezterm/dot-config/wezterm/font.lua
font_family      Hack
font_size        18.0

# Hack has none, but be explicit in case I swap fonts
disable_ligatures always

# --- keyboard -----------------------------------------------------------
# Left Option sends <M-...> for readline/vim word motions; right Option stays
# a compose key for accented characters
macos_option_as_alt left

# --- scrollback ---------------------------------------------------------
# Matches history-limit in tmux/dot-tmux.conf
scrollback_lines 50000

# --- window -------------------------------------------------------------
remember_window_size    yes
window_padding_width    4
confirm_os_window_close 0

# image.nvim already hides images when unfocused; dimming makes that flicker
inactive_text_alpha 1.0

# cursor shape reporting, prompt marking, etc
shell_integration enabled

# nothing here needs it, and it's a local socket surface
allow_remote_control no

macos_quit_when_last_window_closed yes
